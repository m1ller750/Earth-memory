# Windows installer for the Earth Memory desktop app (npm run desktop:build).
appId: org.earthmemory.desktop
electronVersion: 45.5.0
productName: Earth Memory
copyright: Earth Memory contributors
directories:
  app: desktop
  output: dist-desktop
  buildResources: desktop
# The shell needs no packages: the server and its node_modules ship in resources/server (extraResources).
files:
  - main.cjs
  - icon.png
  - package.json
  - "!**/node_modules{,/**/*}"
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - "**/*"
  # electron-builder leaves node_modules out of a directory copy, so the server's packages get their own entry.
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - "**/*"
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Earth Memory
  artifactName: Earth-Memory-Setup.exe
